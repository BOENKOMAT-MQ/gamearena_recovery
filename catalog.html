<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="description" content="Каталог игровых мест GameArena: схема трёх залов, стандарт, VIP, bootcamp, стримерская и консольная зона. Фильтры по типу и цене.">
    <meta name="theme-color" content="#08090a">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2308090a'/%3E%3Crect x='9' y='9' width='14' height='14' fill='none' stroke='%23c6ff2e' stroke-width='2' transform='rotate(45 16 16)'/%3E%3C/svg%3E">
    <link rel="preload" href="assets/fonts/onest-cyrillic-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="assets/fonts/unbounded-800.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="assets/css/main.css">
    <title>Каталог мест — GameArena</title>
</head>

<body data-page="catalog">
    <main>
        <section class="page-head">
            <div class="wrap">
                <p class="eyebrow reveal">8 позиций · 3 зала</p>
                <h1 class="reveal">Каталог мест</h1>
                <p class="lead reveal">Выберите зал на схеме клуба или отфильтруйте по типу. Каждое место — со своим
                    железом и ценой за час.</p>
            </div>
        </section>

        <section class="section" style="padding-top:0">
            <div class="wrap">
                <div class="obsidian reveal">
                    <div class="obsidian__bar">
                        <span class="obsidian__title">Схема клуба</span>
                        <span class="obsidian__hint">выберите зал</span>
                    </div>
                    <div class="obsidian__map" id="hallmap" role="group" aria-label="Схема залов клуба"></div>
                    <div class="obsidian__legend">
                        <span><i class="lg lg--arena"></i>Arena · 40 ПК</span>
                        <span><i class="lg lg--pro"></i>Pro · bootcamp</span>
                        <span><i class="lg lg--lounge"></i>Lounge · VIP</span>
                    </div>
                </div>

                <div class="filter-row reveal">
                    <div class="chips" id="typeChips" role="group" aria-label="Фильтр по типу зоны">
                        <button type="button" class="chip is-on" data-type="">Все</button>
                        <button type="button" class="chip" data-type="standard">Стандарт</button>
                        <button type="button" class="chip" data-type="vip">VIP</button>
                        <button type="button" class="chip" data-type="bootcamp">Bootcamp</button>
                        <button type="button" class="chip" data-type="stream">Стримерская</button>
                        <button type="button" class="chip" data-type="console">Консольная</button>
                    </div>
                    <div class="filter-row__right">
                        <label class="sort-label" for="f-sort">Сортировка</label>
                        <select class="select select--sm" id="f-sort">
                            <option value="">По умолчанию</option>
                            <option value="asc">Дешёвые</option>
                            <option value="desc">Дорогие</option>
                        </select>
                    </div>
                </div>

                <p class="count-line"><span class="mono" id="count">8</span> мест · <span id="hallName">весь клуб</span></p>
                <div class="cards" id="list"></div>
            </div>
        </section>
    </main>
    <script src="assets/js/main.js" defer></script>
</body>

</html>
